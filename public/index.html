<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odatlar Trekeri — Mini App</title>
  <!-- Telegram WebApp Script -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-color: #3b82f6;
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success-color: #10b981;
      --warning-color: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header Profile Card */
    .header-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .user-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .user-name {
      font-size: 1.25rem;
      font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .user-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .streak-badge {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fbbf24;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Stats Overview Card */
    .stats-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stats-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .progress-bar-bg {
      background: rgba(255, 255, 255, 0.1);
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: var(--accent-gradient);
      height: 100%;
      width: 0%;
      transition: width 0.6s ease;
    }

    /* Week Day Calendar Grid */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-top: 8px;
    }

    .day-cell {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 8px 4px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .day-cell.active {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.5);
    }

    .day-name {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .day-status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
    }

    .day-status.completed {
      background: var(--success-color);
      box-shadow: 0 0 8px var(--success-color);
    }

    /* Section Title */
    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Habits List */
    .habits-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .habit-item {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.2s ease;
    }

    .habit-item:active {
      transform: scale(0.98);
    }

    .habit-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .habit-name {
      font-size: 1rem;
      font-weight: 600;
    }

    .habit-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      gap: 12px;
    }

    .habit-tag {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Habit action buttons */
    .habit-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .action-btn {
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .action-btn:active {
      transform: scale(0.95);
    }

    .done-btn {
      background-color: var(--success-color);
      color: white;
    }

    .done-btn:hover {
      background-color: #059669;
    }

    .skip-btn {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
    }

    .skip-btn:hover {
      background-color: rgba(255, 255, 255, 0.15);
    }

    .status-completed {
      color: var(--success-color);
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Floating Action Button */
    .fab-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--accent-gradient);
      color: #fff;
      border: none;
      border-radius: 30px;
      padding: 14px 24px;
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Profile Header Card -->
  <div class="header-card">
    <div class="user-info">
      <div class="user-name" id="userName">Foydalanuvchi</div>
      <div class="user-subtitle">Shaxsiy Odatlar Boshqaruvi</div>
    </div>
    <div class="streak-badge">
      🔥 <span id="streakCount">1</span> kun
    </div>
  </div>

  <!-- Overall Statistics Progress Card -->
  <div class="stats-card">
    <div class="stats-title">
      <span>Bugungi Natija</span>
      <span id="progressPercent">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>

    <!-- 7-Day Activity Grid -->
    <div class="calendar-grid">
      <div class="day-cell"><span class="day-name">Du</span><div class="day-status completed"></div></div>
      <div class="day-cell"><span class="day-name">Se</span><div class="day-status completed"></div></div>
      <div class="day-cell"><span class="day-name">Ch</span><div class="day-status completed"></div></div>
      <div class="day-cell"><span class="day-name">Pa</span><div class="day-status completed"></div></div>
      <div class="day-cell"><span class="day-name">Ju</span><div class="day-status completed"></div></div>
      <div class="day-cell active"><span class="day-name">Sh</span><div class="day-status completed"></div></div>
      <div class="day-cell"><span class="day-name">Ya</span><div class="day-status"></div></div>
    </div>
  </div>

  <!-- Section Title -->
  <div class="section-title">
    📋 Sizning Odatlaringiz
  </div>

  <!-- Habits List Container -->
  <div class="habits-list" id="habitsContainer">
    <div class="empty-state">Odatlar yuklanmoqda...</div>
  </div>

  <script>
    // Initialize Telegram WebApp API
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    const userId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;
    const userName = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.first_name : 'Foydalanuvchi';

    document.getElementById('userName').textContent = userName;

    async function loadHabits() {
      const container = document.getElementById('habitsContainer');
      try {
        const queryParam = userId ? `?userId=${userId}` : '';
        const response = await fetch(`/api/habits${queryParam}`);
        const data = await response.json();

        if (!data.habits || data.habits.length === 0) {
          container.innerHTML = `<div class="empty-state">Sizda hali hech qanday odat yo'q. Telegram botda "➕ Yangi odat" tugmasini bosing.</div>`;
          document.getElementById('progressPercent').textContent = '0%';
          document.getElementById('progressBar').style.width = '0%';
          return;
        }

        let completedCount = 0;
        container.innerHTML = '';

        data.habits.forEach(habit => {
          const isCompletedToday = habit.lastCompletedAt && habit.lastCompletedAt.startsWith(new Date().toISOString().split('T')[0]);
          if (isCompletedToday) completedCount++;

          const item = document.createElement('div');
          item.className = 'habit-item';
          item.innerHTML = `
            <div class="habit-details">
              <div class="habit-name">${habit.name}</div>
              <div class="habit-meta">
                <span class="habit-tag">📋 ${habit.intervalDescription || habit.intervalType}</span>
                <span class="habit-tag">⏰ ${habit.targetTime}</span>
              </div>
            </div>
            <div class="habit-actions">
              ${isCompletedToday 
                ? `<span class="status-completed">✅ Bajarildi</span>` 
                : `<button class="action-btn done-btn" onclick="completeHabit('${habit.id}')">Bajarildi</button>
                   <button class="action-btn skip-btn" onclick="skipHabit('${habit.id}')">Qoldirish</button>`
              }
            </div>
          `;
          container.appendChild(item);
        });

        const percent = Math.round((completedCount / data.habits.length) * 100);
        document.getElementById('progressPercent').textContent = `${percent}%`;
        document.getElementById('progressBar').style.width = `${percent}%`;

      } catch (err) {
        console.error('Odatlarni yuklashda xatolik:', err);
        container.innerHTML = `<div class="empty-state">Ma'lumotlarni yuklashda xatolik yuz berdi.</div>`;
      }
    }

    async function completeHabit(habitId) {
      if (!userId) return alert("Telegram ID aniqlanmadi.");
      try {
        const response = await fetch('/api/habits/done', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, habitId })
        });
        const resData = await response.json();
        if (resData.success) {
          loadHabits();
        } else {
          alert("Xatolik yuz berdi: " + (resData.error || "Noma'lum xato"));
        }
      } catch (err) {
        console.error(err);
        alert("Server bilan bog'lanishda xatolik yuz berdi.");
      }
    }

    async function skipHabit(habitId) {
      if (!userId) return alert("Telegram ID aniqlanmadi.");
      try {
        const response = await fetch('/api/habits/skip', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, habitId })
        });
        const resData = await response.json();
        if (resData.success) {
          loadHabits();
        } else {
          alert("Xatolik yuz berdi: " + (resData.error || "Noma'lum xato"));
        }
      } catch (err) {
        console.error(err);
        alert("Server bilan bog'lanishda xatolik yuz berdi.");
      }
    }

    loadHabits();
  </script>
</body>
</html>
